<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contactos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📒 Agenda de Contactos</h1>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre, teléfono o email...">
            <button id="clearSearchBtn" class="clear-btn">✖</button>
        </div>

        <div class="contact-form">
            <h3>📝 Nuevo Contacto</h3>
            <input type="text" id="contactName" placeholder="Nombre completo *" required>
            <input type="tel" id="contactPhone" placeholder="Teléfono *" required>
            <input type="email" id="contactEmail" placeholder="Email (opcional)">
            <input type="hidden" id="editId" value="">
            <div class="form-buttons">
                <button id="saveBtn">💾 Guardar Contacto</button>
                <button id="cancelBtn" style="display:none;">❌ Cancelar Edición</button>
            </div>
        </div>

        <hr>

        <h3>📱 Mis Contactos</h3>
        <div class="stats">
            <span id="totalContacts">0</span> contactos totales
        </div>

        <ul id="contactsList" class="contacts-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
